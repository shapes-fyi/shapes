name: Shapes Validate
description: >-
  Run `shapes validate` and `shapes ci-check` against a repository's
  `.shapes/` directory. Enforces graph integrity, amendment-required-
  on-promoted-or-canonical-change (CI-002), amendment immutability
  (CI-003), and optionally that every PR touches the shapes directory
  at all (CI-001).
author: shapes-fyi
branding:
  icon: check-circle
  color: purple

inputs:
  shapes-dir:
    description: Path to the shapes directory, relative to the repo root.
    required: false
    default: .shapes
  base-ref:
    description: >-
      Base ref to diff against for ci-check. In a pull_request workflow
      this should be the PR base sha (the default). Set explicitly when
      reusing the action outside the pull_request event.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  require-shapes-changes:
    description: >-
      Fail when the PR does not touch the shapes directory. On by
      default — set to 'false' for repos that allow code-only or
      docs-only PRs.
    required: false
    default: 'true'
  shapes-version:
    description: >-
      Git ref of shapes-fyi/shapes to install. Pin to a release tag
      (e.g. v1) for stability.
    required: false
    default: v1
  install-shapes:
    description: >-
      When 'true' (the default), the action installs the `shapes`
      binary via `cargo install --locked --git --tag <version>`. Set
      to 'false' if a previous step has already placed `shapes` on
      PATH (used by this repo's own dogfood job).
    required: false
    default: 'true'
  allow-realization-refresh:
    description: >-
      When 'true', changes to `realization` bindings on a promoted or
      canonical node do not fire CI-002. Whether binding refreshes
      count as "mechanical hygiene" or "semantic change" is a
      per-project policy call — each repo chooses. Default 'false'
      (strict).
    required: false
    default: 'false'
  allow-evidence-refresh:
    description: >-
      When 'true', changes to `evidence` bindings on a promoted or
      canonical node do not fire CI-002. Default 'false' (strict).
    required: false
    default: 'false'
  allow-provenance-refresh:
    description: >-
      When 'true', changes to `provenance` bindings on a promoted or
      canonical node do not fire CI-002. Default 'false' (strict).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      if: inputs.install-shapes == 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo cache
      if: inputs.install-shapes == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Install shapes-cli
      if: inputs.install-shapes == 'true'
      shell: bash
      run: |
        cargo install --locked \
          --git https://github.com/shapes-fyi/shapes \
          --tag "${{ inputs.shapes-version }}" \
          shapes-cli

    - name: shapes validate
      shell: bash
      run: |
        if [ ! -d "${{ inputs.shapes-dir }}" ]; then
          echo "::warning::No shapes directory at '${{ inputs.shapes-dir }}' — skipping shapes validate"
          exit 0
        fi
        shapes validate

    - name: shapes ci-check
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        SHAPES_DIR: ${{ inputs.shapes-dir }}
        REQUIRE_CHANGES: ${{ inputs.require-shapes-changes }}
        ALLOW_REALIZATION: ${{ inputs.allow-realization-refresh }}
        ALLOW_EVIDENCE: ${{ inputs.allow-evidence-refresh }}
        ALLOW_PROVENANCE: ${{ inputs.allow-provenance-refresh }}
      run: |
        if [ ! -d "$SHAPES_DIR" ]; then
          echo "::warning::No shapes directory at '$SHAPES_DIR' — skipping shapes ci-check"
          exit 0
        fi
        args=(ci-check --base "$BASE_REF" --shapes-dir "$SHAPES_DIR")
        if [ "$REQUIRE_CHANGES" = "true" ]; then
          args+=(--require-shapes-changes)
        fi
        if [ "$ALLOW_REALIZATION" = "true" ]; then
          args+=(--allow-realization-refresh)
        fi
        if [ "$ALLOW_EVIDENCE" = "true" ]; then
          args+=(--allow-evidence-refresh)
        fi
        if [ "$ALLOW_PROVENANCE" = "true" ]; then
          args+=(--allow-provenance-refresh)
        fi
        shapes "${args[@]}"
