name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shapes

jobs:
  # ── Gate: reuse existing CI ────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Build cross-platform binaries ─────────────────────────────────
  build-binaries:
    needs: ci
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-14
            use_cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          tar czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          7z a "$STAGING.zip" "$STAGING"
          echo "ASSET=$STAGING.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # ── Publish to crates.io (idempotent) ─────────────────────────────
  publish-crates-io:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check if version already published
        id: check
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          STATUS=$(curl -sL -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/shapes-cli/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already published to crates.io, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not yet published, proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Create GitHub Release with Claude-drafted notes ───────────────
  create-release:
    needs: [build-binaries, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev-tag
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV" ]; then
            PREV=$(git rev-list --max-parents=0 HEAD)
            echo "first_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "first_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous ref: $PREV"

      - name: Gather release context
        id: context
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV="${{ steps.prev-tag.outputs.tag }}"

          {
            echo "GIT_LOG<<GITLOG_EOF"
            git log --pretty=format:'- %h %s (%an)' "$PREV".."$TAG"
            echo ""
            echo "GITLOG_EOF"
          } >> "$GITHUB_ENV"

          {
            echo "DIFF_STAT<<DIFFSTAT_EOF"
            git diff --stat "$PREV".."$TAG"
            echo "DIFFSTAT_EOF"
          } >> "$GITHUB_ENV"

      - name: Draft release notes with Claude Code
        id: claude-notes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-6
          prompt: |
            You are drafting release notes for shapes-cli version ${{ github.ref_name }}.
            The binary is called `shapes` and is published as `shapes-cli` on crates.io.

            Here is the git log since the previous release (${{ steps.prev-tag.outputs.tag }}):

            ${{ env.GIT_LOG }}

            Here is the diffstat:

            ${{ env.DIFF_STAT }}

            Is this the first release? ${{ steps.prev-tag.outputs.first_release }}

            Instructions:
            1. Analyze the commits and produce well-structured release notes in Markdown.
            2. Use these sections (omit any section that has no entries):
               - **Highlights** — 1-3 sentence summary of the most important changes
               - **Breaking Changes** — anything that breaks backward compatibility
               - **New Features** — new commands, flags, or capabilities
               - **Improvements** — enhancements to existing functionality
               - **Bug Fixes** — corrected behavior
               - **Internal / Refactoring** — code quality, CI, deps, docs
            3. Write for end users — focus on what changed and why it matters.
            4. Do NOT wrap the output in ```markdown``` fences. Output raw Markdown only.
            5. End with an "Install" section showing:
               ```
               # From crates.io
               cargo install shapes-cli

               # Or download a prebuilt binary from the assets below
               ```
            6. Output ONLY the release notes Markdown. No preamble, no commentary.

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts/

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.claude-notes.outputs.result }}
        run: |
          TAG="${{ github.ref_name }}"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, updating"
            gh release edit "$TAG" \
              --title "shapes-cli $TAG" \
              --notes "$RELEASE_NOTES"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --title "shapes-cli $TAG" \
              --notes "$RELEASE_NOTES" \
              artifacts/*
          fi
