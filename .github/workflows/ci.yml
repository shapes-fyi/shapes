name: CI

# Enforces the Rust Idioms Refactor constraint suite (19–33) on every
# push and pull request: formatting, clippy, nextest, rustdoc, supply
# chain, and dead-dep gates.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta
      - run: cargo nextest run --all-targets
      # Enforces constraint 30 (Snapshot Tests for CLI Output): fail
      # the build if any pending snapshots remain after the test run
      # — either unreviewed `.snap.new` files committed to the tree,
      # or fresh pending output generated by the test run itself. The
      # cargo-insta CLI has no --exit-code flag on pending-snapshots,
      # so we use --as-json (which prints one JSON line per pending
      # snapshot and nothing when clean) and fail on any output. This
      # matches the spirit of constraint 30's stated verification_method.
      - name: Fail on pending insta snapshots
        shell: bash
        run: |
          pending=$(cargo insta pending-snapshots --as-json)
          if [ -n "$pending" ]; then
            echo "::error::Pending insta snapshots detected:"
            cargo insta pending-snapshots
            exit 1
          fi

  doc:
    name: cargo doc (warnings as errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  machete:
    name: cargo machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@v0.9.1

  shapes-ci:
    name: shapes ci-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build shapes-cli from PR sources
        run: cargo build --release --locked
      - name: shapes validate
        run: ./target/release/shapes validate
      - name: shapes fmt --check
        run: ./target/release/shapes fmt --check
      - name: shapes ci-check
        run: |
          ./target/release/shapes ci-check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --require-shapes-changes
