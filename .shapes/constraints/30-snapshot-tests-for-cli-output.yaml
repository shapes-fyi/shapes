id: 30
name: Snapshot Tests for CLI Output
description: CLI commands whose stdout, stderr, or on-disk scaffold output is part of the agent-readable contract are covered by insta snapshots, so reviewers see a diff on any byte change.
kind: requirement
rule: Every CLI command that emits stdout/stderr text or writes a scaffold file is covered by an insta snapshot in tests/. The snapshot captures the full output verbatim; reviewers diff the .snap file in PRs. String-contains assertions are acceptable only for behaviors that cannot be captured as deterministic output.
enforcement: manual
profile: 1
status: canonical
intent:
  kind: requirement
  summary: insta snapshots cover every behavior-surface CLI output
  source: ai
  exceptions: Non-deterministic output (timestamps, absolute paths, PIDs) may be redacted with insta filters rather than matched literally.
  impact_if_violated: Agents that parse shapes CLI output can break on a whitespace or ordering change that no test flagged, and reviewers have no way to see the change in a PR diff.
  rationale: The Rust Idioms Refactor plan explicitly called out the CLI's observable surface — clap schema, scaffold YAML text, exit codes, stdout/stderr layout — as byte-load-bearing for agents. Existing tests assert substrings, which miss regressions in whitespace, ordering, and surrounding context. insta snapshots make every byte of output part of the review diff so silent drifts become impossible to land accidentally.
  verification_method: Snapshot files live under tests/snapshots/; CI runs `cargo nextest run` and `cargo insta pending-snapshots --exit-code` (or equivalent) to fail on unreviewed changes.
evidence:
- id: insta-snapshots-cover-every-cli-command
  type: test
  bindings:
  - scheme: path
    value: tests/cli_snapshots.rs
    metadata:
      summary: Insta snapshot suite for every CLI read command — get/list/tree/query/validate — over a deterministic fixture seeded via `shapes create --from -`. Covers yaml + json output formats, the clean and dirty validate paths, and reciprocal inheritance walks. 23 snapshots under tests/snapshots/cli_snapshots__*.snap.
  - scheme: path
    value: tests/cli_ci_check.rs
    metadata:
      summary: ci_check_snapshots module — locks the exact stderr message text for the clean path, CI-001 (no-.shapes-diff-under-require-shapes-changes), and CI-002 (promoted shape edited without amendment). 3 snapshots under tests/snapshots/cli_ci_check__ci_check_snapshots__*.snap.
  - scheme: path
    value: tests/cli_scaffold.rs
    metadata:
      summary: Pre-existing scaffold_snapshots module — locks the YAML emitted by `shapes create` for shapes/constraints/profiles across the software, research, editorial, and minimal kits. Listed here for completeness so the evidence set for constraint 30 names every snapshot file that realizes it.
  trusted: true
