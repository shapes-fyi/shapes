id: 39
name: NodeId Macro Generation
description: All four node ID newtypes must be generated by a single declarative macro (define_id!) and must implement the NodeId trait. This eliminates 4x duplicated 35-line blocks and guarantees structural consistency — adding a new method to all IDs requires a single change in the macro.
kind: invariant
rule: All four ID newtypes (ShapeId, ConstraintId, AmendmentId, ProfileId) MUST be generated by the define_id! macro and MUST implement the NodeId trait. Hand-written ID type definitions are prohibited.
enforcement: machine
profile: 1
status: canonical
intent:
  kind: invariant
  summary: ID newtypes generated by macro, implement NodeId trait
  source: ai
  impact_if_violated: ID types drift out of sync — one type gets a method the others lack, or a derive attribute is forgotten on one type but not others. Generic DAG code cannot use associated types to access NODE_TYPE.
  rationale: Four identical 35-line blocks (struct def, new, get, Display, FromStr) are a DRY violation. The macro guarantees structural consistency and ensures all IDs share the same API surface. The NodeId trait enables generic code to convert between typed wrappers and raw u64 without knowing the concrete type.
  verification_method: The macro is the sole definition site. Any hand-written ID struct will conflict with or duplicate the macro output, causing a compilation error.
realization:
- bindings:
  - scheme: path
    value: src/model/ids.rs
    metadata:
      summary: define_id! macro definition, NodeId trait, and four macro invocations generating ShapeId/ConstraintId/AmendmentId/ProfileId
  role: primary
