intent:
  kind: module
  summary: Formal, implementation-agnostic specification with JSON schemas, typed operations, invariants, discovery mechanisms, transport bindings, and conformance tests
  source: human
  goals: Define what any Shapes implementation must satisfy independent of transport. Enable alternative implementations (Python, Go, MCP server) without reverse-engineering the Rust CLI.
  non_goals: Not a tutorial or user guide. Not implementation advice.
  rationale: The specification was implicit in the CLI. Making it explicit separates the abstract spec from concrete implementation.
