id: 1
name: Shapes CLI
description: >-
  Monorepo implementing the Shapes Context Protocol. Contains a Rust CLI that
  provides AI coding agents with structured, queryable access to project intent,
  constraints, and boundaries stored as two directed acyclic graphs, plus a web
  specification site (shapes.fyi) with interactive schema exploration, and a
  shared UI component library. Designed for zero-dependency, file-based
  operation so agents can discover context via CLI commands on demand without
  needing a running server or pre-loaded prompts.
profile: 1
status: promoted
intent:
  kind: system
  summary: >-
    Rust CLI implementing the Shapes Context Protocol — gives AI agents
    structured access to project intent, constraints, and boundaries
  source: human
  goals: >-
    Give AI agents a complete discovery toolkit for project context. Agents
    should be able to understand the full project map, find relevant constraints,
    trace design rationale, and discover what rules apply to any piece of work —
    all through CLI commands.
  rationale: >-
    AI agents working on codebases lack access to the unwritten knowledge that
    engineers carry — why architectural decisions were made, what invariants must
    hold, what's in scope vs out of scope. Code tells you what exists; shapes
    capture why. A CLI tool was chosen because agents can invoke it directly,
    YAML files are git-friendly and human-readable, and zero runtime dependencies
    mean it works anywhere without setup.
  non_goals: >-
    Not a runtime enforcement tool — shapes describe intent but don't block
    compilation or deployment. Not a replacement for documentation — shapes
    capture structured intent that documentation often lacks.
