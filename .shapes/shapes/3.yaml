id: 3
name: File Store
description: >-
  YAML-based persistence layer that manages the .shapes/ directory structure.
  Handles ID allocation via an auto-incrementing counter in meta.yaml, generic
  load/save operations for any node type, and directory listing. Each node type
  gets its own subdirectory (shapes/, constraints/, amendments/, profiles/) with
  files named by ID (e.g., 1.yaml, 2.yaml).
profile: 1
status: promoted
intent:
  kind: module
  summary: >-
    YAML-based persistence layer managing .shapes/ directory, ID allocation,
    and node serialization
  source: human
  goals: >-
    Provide reliable, atomic-ish file I/O for the shapes graph. ID allocation
    must be monotonically increasing and never reuse IDs. Generic load/save must
    work for any serde-compatible node type without per-type boilerplate.
  rationale: >-
    A file-based store was chosen over a database for three reasons: YAML files
    diff well in git, there are zero runtime dependencies, and agents can
    read/write files directly. The Store abstraction isolates all filesystem
    operations so commands and DAG algorithms never touch files directly.
  non_goals: >-
    Not designed for concurrent access — relies on git for conflict resolution.
    Not optimized for large graphs (hundreds of thousands of nodes).
constraints:
  - 4
  - 5
  - 8
parents:
  - id: 1
    role: component
realization:
  - bindings:
      - scheme: path
        value: src/store.rs
        metadata:
          summary: Store struct — open/init .shapes/ directory, Meta/NextIds, next_id(), generic save/load, list_ids
    role: primary
