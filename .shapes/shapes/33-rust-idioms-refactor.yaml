id: 33
name: Rust Idioms Refactor
description: >-
  Whole-crate refactor that brings src/ into strict alignment with idiomatic
  Rust and consolidates the domain-schema layer onto Profiles. Enforces
  architectural constraints 19–34: lean mod.rs files, module-level //! docs,
  /// docs on every public symbol, removal of ASCII section dividers,
  &str-over-String discipline, a fixed crate-root lint baseline, justified
  #[allow] attributes, no silent unwrap/expect, #[must_use] on pure getters,
  a pinned rustfmt.toml, a cargo-deny supply chain gate, cargo-machete
  dead-dep enforcement, insta snapshot coverage of CLI output, rustdoc
  warnings promoted to errors, a GitHub Actions workflow wiring the whole
  lot into CI, and the Template→Profile consolidation that makes Profile
  the sole source of truth for intent field hints, kind allow-lists,
  default kinds, and required-field enforcement.
status: proposed
profile: 1
parents:
  - id: 1
    role: parent
intent:
  kind: feature
  summary: >-
    Whole-crate Rust idioms refactor enforcing constraints 19–28 across src/
  source: ai
  goals: >-
    Implement constraints 19–28 across every file under src/. Eliminate
    ASCII section dividers in favor of submodule splits and item-level
    /// docs. Document every public symbol with /// comments. Add a crate
    root lint baseline (deny(unsafe_code), warn(missing_docs),
    warn(rust_2018_idioms)) plus rustfmt.toml. Restructure src/commands/
    into a verb/noun subdirectory layout so commands/mod.rs becomes pure
    wiring. Split src/model/common.rs along its existing internal sections
    so each concept (status, intent, serde helpers, newtype IDs) lives in
    its own file. Add #[must_use] to pure getters. Audit and justify every
    .unwrap()/.expect() and #[allow] in non-test code.
  rationale: >-
    The CLI crate is the canonical reference implementation of the Shapes
    protocol. Agents read its source as ground truth, and the current
    section-divider style + sparse public docs make that harder than it
    should be. Codifying these idioms as graph constraints (rather than
    relying on reviewer memory) means future code stays aligned
    automatically and reviewers have something concrete to point at.
  non_goals: >-
    Refactoring apps/web, packages/ui, or the spec site. Changing public
    CLI behavior — clap schema, scaffold YAML output, exit codes, and
    stdout/stderr layout must remain byte-identical. Altering .shapes/
    YAML on disk beyond this refactor's own bookkeeping. Swapping or
    upgrading dependencies. Introducing Cow, async, or other complexity
    that fights constraint:9 Minimal Complexity.
