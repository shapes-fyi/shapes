id: 11
name: Store Data Flow
description: >-
  The data flow through the CLI follows a linear pipeline: user (or agent)
  invokes a shapes command, clap parses arguments into typed structs, the
  command handler opens a Store pointing at .shapes/, the Store loads YAML
  files into Rust structs via serde, DAG algorithms traverse the in-memory
  node collections, and results are serialized back to YAML or JSON on stdout.
  Errors and metadata go to stderr. No data is held in memory between
  invocations — each command is stateless.
profile: 1
status: canonical
intent:
  kind: data-flow
  summary: >-
    User runs CLI command -> clap parses args -> command handler opens Store ->
    loads/saves YAML nodes -> DAG algorithms traverse in-memory -> serialized
    output to stdout
  source: human
  goals: >-
    Keep the data flow simple and stateless. Store scans directory, reads each
    YAML file, matches by `id` field. Filenames are human-readable slugs. ID
    allocation derives from scanning existing nodes (max + 1). Each command
    invocation is self-contained: open store, do work, output result. No
    caching, no background processes, no state between invocations.
  rationale: >-
    Stateless design was chosen because agents invoke the CLI as a subprocess
    for each query. There is no long-running process to maintain state between
    calls. This also means the CLI is safe to run concurrently (reads are safe;
    writes should be serialized by the caller).
  non_goals: >-
    No caching or memoization between invocations. No background indexing or
    file watching. Does not support concurrent writes — callers must serialize
    write operations.
parents:
  - id: 1
    role: data-flow
realization:
  - bindings:
      - scheme: path
        value: src/main.rs
        metadata:
          summary: Entry point — run() dispatches commands, orchestrates the full request pipeline
    role: primary
  - bindings:
      - scheme: path
        value: src/store.rs
        metadata:
          summary: Store I/O layer — scans YAML files by id field, generates slug filenames from names, derives next ID by max + 1. Loads into Rust structs, saves back
    role: supporting
  - bindings:
      - scheme: path
        value: src/commands/mod.rs
        metadata:
          summary: Command handlers — bridge between CLI args and Store/DAG operations
    role: supporting
