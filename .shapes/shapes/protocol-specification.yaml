id: 23
name: Protocol Specification
description: >-
  Formal, implementation-agnostic protocol specification with JSON schemas,
  typed operations, invariants, discovery mechanisms, transport bindings, and
  conformance tests. Defines what any Shapes implementation must satisfy
  independent of transport or language.
profile: 1
status: proposed
intent:
  kind: module
  summary: >-
    Formal, implementation-agnostic protocol specification with JSON schemas,
    typed operations, invariants, discovery mechanisms, transport bindings, and
    conformance tests
  source: human
  goals: >-
    Define what any Shapes implementation must satisfy independent of transport.
    Enable alternative implementations (Python, Go, MCP server) without
    reverse-engineering the Rust CLI.
  rationale: >-
    The protocol was implicit in the CLI. Making it explicit separates the
    abstract protocol from concrete implementation.
  non_goals: >-
    Not a tutorial or user guide. Not implementation advice.
