id: 2
name: Data Model
description: >-
  Serde-backed Rust data structures defining the four node types of the Shapes
  protocol: Shape, Constraint, Amendment, and Profile. Also includes shared
  types like Intent (open map), Status (seven-state lifecycle), Realization
  (code bindings), Evidence (constraint proofs), and Provenance (decision
  history). All types derive Serialize/Deserialize for YAML and JSON output.
profile: 1
status: promoted
intent:
  kind: module
  summary: >-
    Serde-backed data structures for all four node types: Shape, Constraint,
    Amendment, Profile
  source: human
  goals: >-
    Provide a faithful Rust representation of every Shapes protocol concept.
    Types must round-trip through YAML serialization without data loss. The
    Intent open-map pattern must allow arbitrary extra fields while keeping
    required fields typed. Untagged enums (ShapeRef, ConstraintRef) must allow
    both ID references and inline node definitions.
  rationale: >-
    Separating data structures from I/O and business logic keeps the model
    testable and spec-aligned. Using serde with custom serialization for Status
    and Intent ensures the YAML output matches the shapes.fyi spec format while
    remaining ergonomic in Rust code.
  non_goals: >-
    Not responsible for I/O or persistence — the Store layer handles YAML
    reading and writing. Not responsible for graph algorithms — the DAG Engine
    operates on loaded instances.
  spec_section: Core Data Model (Shape, Constraint, Amendment, Profile nodes)
constraints:
  - 5
  - 6
  - 13
parents:
  - id: 1
    role: component
children:
  - shape: 7
    role: pattern
  - shape: 8
    role: pattern
realization:
  - bindings:
      - scheme: path
        value: src/model/mod.rs
        metadata:
          summary: Module root — newtype ID wrappers (ShapeId, ConstraintId, AmendmentId, ProfileId) with serde(transparent), NodeType enum, re-exports
    role: primary
  - bindings:
      - scheme: path
        value: src/model/shape.rs
        metadata:
          summary: Shape struct with parent_ids()/child_ids() methods — Vec fields with serde default/skip_serializing_if
    role: primary
  - bindings:
      - scheme: path
        value: src/model/constraint.rs
        metadata:
          summary: Constraint struct with parent_ids()/child_ids() methods — Vec fields with serde default/skip_serializing_if
    role: primary
  - bindings:
      - scheme: path
        value: src/model/amendment.rs
        metadata:
          summary: Amendment struct — targets (shape/constraint/profile IDs), version_impact, InitiatedBy
    role: primary
  - bindings:
      - scheme: path
        value: src/model/profile.rs
        metadata:
          summary: Profile struct — Lifecycle, FieldDef, ProfileFields, FieldSection, Versioning, AmendmentRules
    role: primary
  - bindings:
      - scheme: path
        value: src/model/common.rs
        metadata:
          summary: Shared types — Status (7 states), Intent (open map), Binding, Realization, Evidence, Provenance, ParentRef. Vec/BTreeMap fields use serde default attributes.
    role: primary
