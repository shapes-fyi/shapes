id: 4
name: Command Layer
description: >-
  Implementation of all seven CLI commands: init (create .shapes/ directory),
  create (new nodes from flags or YAML files), get (retrieve single node),
  list (filter and display nodes), tree (delegate to DAG visualization),
  query (delegate to DAG traversal), and validate (delegate to DAG validation).
  Handles output serialization to YAML or JSON based on the --format flag.
profile: 1
status: canonical
intent:
  kind: module
  summary: >-
    CLI command implementations: init, create, get, list, tree, query, validate
  source: human
  goals: >-
    Provide the complete set of CLI operations agents need to discover and
    manage shapes context. Every command should have clear, predictable output
    that agents can parse. Support both human-readable YAML and machine-parseable
    JSON output.
  rationale: >-
    Commands are separated from DAG algorithms and the store layer so each can
    evolve independently. The command layer acts as a thin orchestrator — it
    parses flags, opens the store, delegates to the right function, and
    serializes the result.
  non_goals: >-
    Not responsible for graph algorithm correctness — delegates to DAG Engine.
    Not a shell or REPL — each invocation is stateless. Does not define the
    data model or serialization format.
  spec_section: CLI command semantics
constraints:
  - 6
  - 9
  - 16
  - 17
parents:
  - id: 1
    role: component
children:
  - shape: 12
    role: feature
  - shape: 13
    role: feature
  - shape: 28
    role: feature
  - shape: 32
    role: feature
realization:
  - bindings:
      - scheme: path
        value: src/commands/mod.rs
        metadata:
          summary: >-
            Command handlers — init(template), create() delegating to the
            scaffold writer when --from is absent, get(), list(), tree(),
            query(), validate() with --format json output. resolve_template
            picks the active template from meta.yaml or per-call --template
            override. apply_profile_fields removed; --profile now only
            validates kinds.
    role: primary
