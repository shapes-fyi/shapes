id: 5
name: DAG Engine
description: >-
  Graph algorithms operating on the Shape and Constraint DAGs. Includes BFS
  ancestor/descendant traversal, effective-constraint collection (walks shape
  ancestors gathering all referenced constraints), ASCII tree rendering with
  Unicode box-drawing characters, and comprehensive validation (cycle detection
  via three-color DFS, dangling reference checks, reciprocal link verification,
  amendment target validation, and Profile field requirement enforcement).
profile: 1
status: canonical
intent:
  kind: module
  summary: >-
    Graph algorithms for traversal, tree visualization, constraint inheritance,
    and validation
  source: human
  goals: >-
    Provide correct, spec-compliant graph operations that agents rely on for
    context discovery. The effective-constraints query is the most critical —
    it must correctly collect all constraints that apply to a shape, including
    those inherited from ancestors. Validation must catch all graph integrity
    issues.
  rationale: >-
    DAG algorithms are isolated in their own module because they are the most
    complex code in the CLI and benefit from independent testing. The DagType
    enum allows the same algorithms to operate on both Shape and Constraint
    graphs without duplication.
  non_goals: >-
    Does not handle file I/O — operates on in-memory node collections provided
    by callers. Does not enforce constraints at write time — validation is a
    separate read-only operation invoked explicitly.
  spec_section: DAG traversal and constraint inheritance semantics
constraints:
