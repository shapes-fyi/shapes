id: 17
name: Specification Website
description: >-
  TanStack Start (React 19) web application serving as the public specification
  reference at shapes.fyi. Combines structured spec documentation with
  interactive schema exploration, Mermaid diagram visualization, section minimap
  navigation, and dark/light theme support. Built with Vite + Nitro for SSR,
  file-based routing via TanStack Router. Independent from the CLI at runtime —
  shares the monorepo but not code or data.
profile: 1
status: proposed
intent:
  kind: module
  summary: >-
    Public specification website for the Shapes Specification — reference docs
    plus interactive schema exploration
  source: human
  goals: >-
    Provide an authoritative, readable reference for the Shapes Specification
    that makes the spec accessible to anyone, not just CLI users. Enable
    interactive schema exploration so readers can understand the data model
    without reading Rust source code. Render spec relationships as Mermaid
    diagrams for visual learners.
  rationale: >-
    A dedicated website lowers the barrier to understanding the specification.
    The spec is the primary artifact — the CLI is one implementation, but the
    specification itself needs a home that is tool-agnostic. TanStack Start was
    chosen for modern SSR with React 19 features, file-based routing simplicity,
    and Vite's fast dev experience.
  non_goals: >-
    Not a shapes management tool — the website is read-only and does not create
    or edit shapes. Not a CLI playground or REPL. Not a dashboard for monitoring
    shapes graphs across projects.
  spec_section: Full specification
constraints:
