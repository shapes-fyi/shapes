id: 29
name: Add archived flag to amendments
description: 'Introduce a display-only `archived: bool` field on the Amendment node so decayed audit entries can be hidden from default listing output without losing the audit trail. Extends the CLI with `shapes amendment archive <id>` / `unarchive <id>` and wires `--archived` opt-in flags on `shapes list` and `shapes get`. Relaxes CI-003 only enough to permit archive-only diffs on canonical amendments; every other field remains strictly immutable. Adds a new CI-037 invariant (constraint 37) pinning archival as display-only so validation and CI always see the full amendment set.'
targets:
  shape_ids:
