name: Extract shapes-archive skill from shapes-maintain
description: Move archival decision framework, criteria, mechanics, and CLI commands out of shapes-maintain into a new dedicated shapes-archive skill. The maintain skill now focuses solely on keeping shapes, constraints, and unarchived amendments in sync. The plugin shape gains a fourth child skill (shape 35) and a new realization binding.
