id: 19
name: 'File Store: meta template, read_meta, save_raw'
description: Extends FileStore to record an active scaffolding template in meta.yaml, read it back, and accept raw YAML strings on save so the new scaffold writer can produce comment-bearing files without round-tripping through serde.
targets:
  shape_ids:
  - 3
status: canonical
intent:
  kind: amendment
  summary: Meta gains optional `template:` field; FileStore::init takes a template; new read_meta() and save_raw() helpers expose meta-reading and raw-YAML writes for the scaffold path.
  source: ai
  goals: 'Persist the active template across CLI invocations. Allow callers to write fully-formed YAML strings without going through serde. Preserve back-compat: stores written before this change parse fine because `Meta.template` is `Option<String>` with `#[serde(default)]`.'
  non_goals: Does not change the file naming convention (still `{id}-{slug}.yaml`). Does not change ID allocation. Does not introduce new file formats. Does not break existing stores.
  rationale: The new scaffold writer hand-rolls YAML with `# TODO:` comments and stub sections that would be lost if round-tripped through serde. To support that, FileStore needs a write path that takes pre-formatted content instead of a Serialize value. Recording the template in meta.yaml lets `shapes create` pick the right scaffold defaults without per-call flags.
  spec_section: N/A — internal store extension
realization:
- bindings:
  - scheme: path
    value: src/store.rs
    metadata:
      summary: 'Meta gains `template: Option<String>` with serde default and skip-if-none. Meta::new takes Option<&str>. FileStore::init takes a template parameter. New read_meta() returns parsed Meta; new save_raw() writes a pre-formatted YAML string to a `{id}-{slug}.yaml` path (or overwrites in place when the ID already exists).'
  role: primary
evidence:
- id: legacy-meta-back-compat
  type: test
  bindings:
  - scheme: path
    value: tests/cli_scaffold.rs
    metadata:
      summary: '`legacy_meta_without_template_falls_back_to_software` constructs a hand-built `.shapes/` with a `meta.yaml` that lacks the `template:` field and confirms `shapes create shape` succeeds and falls back to the software template.'
- id: init-template-rejection
  type: test
  bindings:
  - scheme: path
    value: tests/cli_scaffold.rs
    metadata:
      summary: '`init_rejects_unknown_template` confirms `shapes init --template bogus` exits non-zero and leaves no `.shapes/` behind.'
initiated_by:
  type: ai
