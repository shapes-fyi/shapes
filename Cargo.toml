[package]
name = "shapes-cli"
version = "0.1.0"
edition = "2024"
description = "Shapes Specification CLI — structured intent, constraints, and boundaries for software projects"
repository = "https://github.com/shapes-fyi/shapes"
license = "Apache-2.0"

[[bin]]
name = "shapes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serde_yml = "0.0.12"
thiserror = "2"
which = "8"
similar = "3.0.0"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"
