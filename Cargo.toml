[package]
name = "shapes-cli"
version = "0.3.0"
edition = "2024"
description = "Shapes Specification CLI — structured intent, constraints, and boundaries for software projects"
repository = "https://github.com/shapes-fyi/shapes"
license = "Apache-2.0"
readme = "README.md"
keywords = ["shapes", "intent", "constraints", "specification", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "apps/",
  "packages/",
  "bench/",
  "docs/",
  "node_modules/",
  "spec/",
  "tests/",
  ".github/",
  ".shapes/",
  ".claude-plugin/",
  "skills/",
  "turbo.json",
  "tsconfig.json",
  "bun.lock",
  "package.json",
  "skills-lock.json",
  "logo.png",
  "CLAUDE.md",
  "AGENTS.md",
  "TRADEMARK.md",
  ".impeccable.md",
  ".prettierrc",
  ".prettierignore",
  "deny.toml",
  "rustfmt.toml",
]

[[bin]]
name = "shapes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
which = "8"
similar = "3.0.0"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"
